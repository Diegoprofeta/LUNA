name: Build 3.1.3 MMCE fix

on:
  workflow_dispatch:
    inputs:
      psxcore_sha:
        description: 'Optional upstream PSXCore commit; empty uses latest main'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-v3.1.3-mmce
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BASE_SHA: 9c5be408df787000a7e650f66f0a43411060e1d7
      FRONTEND_SHA: 127d012b07322dc0805ce62f877e5ba5e8cd6dbc
      MMCE_SHA: 0e78d1b35c71d1ee43b880c433586d830249b6f0
      ORIGINAL_SHA256: cb07cd7079b8f39f9a7197d0d3c8937c4c51a5dcabf376a5fe159cfcc6e7318e
      BUILD_IMAGE: ps2max/dev@sha256:e390699d46818e7c736f414ae5b1789d3ef7d3d914ce646a8a7bd027bd7e4521
    steps:
      - name: Check out the original 3.1.3 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 9c5be408df787000a7e650f66f0a43411060e1d7
          path: release
          fetch-depth: 1
          persist-credentials: false

      - name: Pin upstream PSXCore and apply only the MMCE fix
        working-directory: release
        env:
          REQUESTED_CORE_SHA: ${{ inputs.psxcore_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse HEAD:nhddl)" = "$FRONTEND_SHA"
          git submodule update --init --recursive nhddl psxcore
          test "$(git -C nhddl rev-parse HEAD)" = "$FRONTEND_SHA"
          test "$(git -C nhddl/iop/mmceman rev-parse HEAD)" = "$MMCE_SHA"
          core_sha="$REQUESTED_CORE_SHA"
          if [ -z "$core_sha" ]; then
            core_sha=$(git ls-remote https://github.com/dnunezx/PSXCore.git refs/heads/main | cut -f1)
          fi
          [[ "$core_sha" =~ ^[0-9a-f]{40}$ ]]
          git -C psxcore fetch origin main
          git -C psxcore merge-base --is-ancestor "$core_sha" origin/main
          git -C psxcore checkout --detach "$core_sha"
          test -z "$(git -C psxcore status --porcelain)"
          echo "CORE_SHA=$core_sha" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('nhddl/iop/mmceman/mmceman/src/mmce_fs.c')
          data = path.read_bytes()
          start = data.index(b'int mmce_fs_dread(')
          end = data.index(b'int mmce_fs_getstat(', start)
          anchor = b'    if (rdbuf[0x4] != 0) {'
          body = data[start:end]
          assert body.count(anchor) == 1
          fix = (
              b'    // MMCE status 1 ends iteration; iomanX expects EOF as 0.\n'
              b'    if (rdbuf[0x4] == 1) {\n'
              b'        mmce_sio2_unlock();\n'
              b'        return 0;\n'
              b'    }\n\n'
          )
          path.write_bytes(data[:start] + body.replace(anchor, fix + anchor, 1) + data[end:])
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('-C', 'nhddl', 'diff', '--name-only', '--ignore-submodules=none') == 'iop/mmceman'
          assert git('-C', 'nhddl/iop/mmceman', 'diff', '--name-only') == 'mmceman/src/mmce_fs.c'
          subprocess.run(['git', '-C', 'nhddl/iop/mmceman', 'diff', '--check'], check=True)
          print('Original frontend retained; only mmce_fs_dread EOF handling changed.')
          PY

      - name: Download and verify the original package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v3.1.3 --repo dnunezx/LUNA \
            --pattern LUNA-v3.1.3-FMCB-mc0.zip --dir original
          printf '%s  %s\n' "$ORIGINAL_SHA256" original/LUNA-v3.1.3-FMCB-mc0.zip | sha256sum -c -

      - name: Build the hardware launcher and unchanged upstream runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/release:/workspace" \
            -e LUNA_BUILD_IMAGE="$BUILD_IMAGE" "$BUILD_IMAGE" sh -eu -c '
              if [ ! -e "$PS2SDK/ps2dev.cmake" ]; then
                ln -s ../share/ps2dev.cmake "$PS2SDK/ps2dev.cmake"
              fi
              export LUNA_BUILD_DIR=/workspace/nhddl/build-mmce-v3.1.3
              export LUNA_EMULATOR_OPTION=OFF
              export LUNA_PSXCORE_DEVELOPMENT=OFF
              sh /workspace/tools/bootstrap-ps2-libtiff.sh
              cmake -S /workspace/nhddl -B "$LUNA_BUILD_DIR" \
                -DCMAKE_BUILD_TYPE=Release -DENABLE_PRINTF=OFF \
                -DLUNA_RELEASE_VERSION=v3.1.3 -DLUNA_EMULATOR_BUILD=OFF \
                -DLUNA_ENABLE_PSXCORE=ON -DLUNA_PSXCORE_DEVELOPMENT=OFF \
                -DLUNA_PSXCORE_SOURCE_DIR=/workspace/psxcore
              sh /workspace/tools/build-luna-psxcore.sh
            '

      - name: Preserve the package and verify the exact changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib
          import os
          import re
          import subprocess
          import zipfile

          source = Path('release')
          build = source / 'nhddl/build-mmce-v3.1.3'
          original = Path('original/LUNA-v3.1.3-FMCB-mc0.zip')
          output = Path('output')
          output.mkdir()
          def git(directory, *args):
              return subprocess.check_output(['git', '-C', str(directory), *args], text=True).strip()
          for directory, expected in (
              (source, os.environ['BASE_SHA']),
              (source / 'nhddl', os.environ['FRONTEND_SHA']),
              (source / 'nhddl/iop/mmceman', os.environ['MMCE_SHA']),
              (source / 'psxcore', os.environ['CORE_SHA']),
          ):
              assert git(directory, 'rev-parse', 'HEAD') == expected
          assert git(source / 'nhddl', 'diff', '--name-only', '--ignore-submodules=none') == 'iop/mmceman'
          assert git(source / 'nhddl/iop/mmceman', 'diff', '--name-only') == 'mmceman/src/mmce_fs.c'
          prefix = 'LUNA-v3.1.3-FMCB-mc0/'
          sha = lambda data: hashlib.sha256(data).hexdigest()
          assert sha(original.read_bytes()) == os.environ['ORIGINAL_SHA256']
          with zipfile.ZipFile(original) as archive:
              assert archive.testzip() is None
              names = [info.filename for info in archive.infolist() if not info.is_dir()]
              assert len(names) == len(set(names))
              assert all(n.startswith(prefix) and '..' not in PurePosixPath(n).parts for n in names)
              files = {n: archive.read(n) for n in names}
          previous = files.copy()
          manifest = prefix + 'SHA256SUMS.txt'
          for line in files[manifest].decode('ascii').splitlines():
              digest, relative = line.split('  ', 1)
              assert sha(files[prefix + relative]) == digest
          metadata = (build / 'psxcore-build.txt').read_text()
          for flag in ('emulator_build=OFF', 'development=OFF', 'runtime_source=matching-checkout',
                       'igr_return=ON', 'disc_swapping=ON', 'igr_return_path=mc0:/APP_LUNA/luna.elf',
                       'psxcore_revision=' + os.environ['CORE_SHA'],
                       'frontend_revision=' + os.environ['FRONTEND_SHA']):
              assert flag in metadata.splitlines(), flag
          cache = (build / 'CMakeCache.txt').read_text()
          assert 'ENABLE_PRINTF:BOOL=OFF' in cache or 'ENABLE_PRINTF:UNINITIALIZED=OFF' in cache
          assert re.search(r'^LUNA_RELEASE_VERSION:[^=]+=v3\.1\.3$', cache, re.MULTILINE)
          for line in (build / 'psxcore-build.sha256').read_text().splitlines():
              digest, relative = line.split('  ', 1)
              assert sha((build / relative).read_bytes()) == digest
          replacements = {
              'APP_LUNA/luna.elf': build / 'luna.elf',
              'APP_LUNA/psxcore-runtime-bootstrap.elf': build / 'psxcore-runtime-bootstrap.elf',
              'LICENSES/PSXCORE-AFL-3.0.txt': source / 'psxcore/LICENSES/AFL-3.0.txt',
              'LICENSES/PSXCORE-NOTICE.txt': source / 'psxcore/LICENSE',
              'LICENSES/PSXCORE-THIRD-PARTY.md': source / 'psxcore/THIRD_PARTY.md',
          }
          for relative, path in replacements.items():
              key = prefix + relative
              assert key in files, relative
              files[key] = path.read_bytes()
          metadata += (
              '\nrelease_version=v3.1.3\n'
              'release_variant=MMCE EOF fix with updated upstream PSXCore\n'
              'base_revision=' + os.environ['BASE_SHA'] + '\n'
              'mmceman_revision=' + os.environ['MMCE_SHA'] + '\n'
              'frontend_change=MMCE directory status 1 maps to EOF\n'
              'original_package_sha256=' + os.environ['ORIGINAL_SHA256'] + '\n'
          )
          files[prefix + 'BUILD-INFO.txt'] = metadata.encode()
          files[manifest] = ''.join(
              f'{sha(data)}  {name[len(prefix):]}\n'
              for name, data in sorted(files.items()) if name != manifest
          ).encode('ascii')
          allowed = {prefix + n for n in replacements} | {prefix + 'BUILD-INFO.txt', manifest}
          changed = {n for n in files if files[n] != previous[n]}
          assert set(files) == set(previous) and changed <= allowed
          assert {prefix + 'APP_LUNA/luna.elf', prefix + 'APP_LUNA/psxcore-runtime-bootstrap.elf'} <= changed
          for name in files:
              parts = PurePosixPath(name).parts
              assert not any(p.lower() in {'tests', 'fixtures', 'local', 'diagnostics', 'psxcore-tester'} for p in parts)
              assert PurePosixPath(name).suffix.lower() not in {'.map', '.log', '.o', '.a', '.exe', '.py', '.sh', '.c', '.h'}
          archive_path = output / 'LUNA-v3.1.3-MMCE-fix-FMCB-mc0.zip'
          with zipfile.ZipFile(archive_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name, data in sorted(files.items()):
                  archive.writestr(name, data)
          with zipfile.ZipFile(archive_path) as archive:
              assert archive.testzip() is None
              assert all(archive.read(name) == data for name, data in files.items())
          (output / 'LUNA-v3.1.3-MMCE-fix.elf').write_bytes(files[prefix + 'APP_LUNA/luna.elf'])
          (output / 'BUILD-INFO.txt').write_text(metadata)
          checksums = ''.join(f'{sha(p.read_bytes())}  {p.name}\n' for p in sorted(output.iterdir()))
          (output / 'SHA256SUMS.txt').write_text(checksums, encoding='ascii')
          assert subprocess.check_output(['git', '-C', str(source / 'psxcore'), 'status', '--porcelain'], text=True) == ''
          summary = (
              '## LUNA 3.1.3 MMCE fix\n\n'
              f'Frontend: `{os.environ["FRONTEND_SHA"]}` plus only the MMCE EOF fix.\n\n'
              f'PSXCore: `{os.environ["CORE_SHA"]}` (unchanged upstream source).\n\n'
              'All other original package files are byte-identical, apart from build/checksum metadata '
              'and any updated PSXCore license notices.\n\n'
              'Hardware build and runtime layout validation passed; physical MMCE/gameplay testing remains. '
              'The public release and tag were not changed.\n\n'
              'Changed package files:\n' + ''.join(f'- `{n[len(prefix):]}`\n' for n in sorted(changed))
          )
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write(summary)
          print(summary)
          PY

      - name: Upload downloadable build files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LUNA-v3.1.3-MMCE-fix-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 30
